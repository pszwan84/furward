<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T1 后端调试台</title><link rel="stylesheet" href="/static/style.css"></head>
<body><header><div><small>本地 API 调试 · P0</small><h1>T1 导航调试台</h1></div><span id="connection">正在读取后端状态</span></header>
<main><section class="notice">模拟数据不能证明真机连接或物理停稳。室内位置为指令积分估算；室外路线为离线合成缓存。</section>
<section class="controls"><button id="stop" class="danger">立即停止</button><button id="cancel">取消导航</button><label>模式 <select id="mode"><option value="outdoor">室外 · 仅引导</option><option value="indoor">室内 · 受控执行</option></select></label><button id="prepare">室外准备</button></section>
<div class="grid"><section><h2>路线与位置</h2><form id="plan"><div id="indoorFields" hidden><label>起点 <input id="from" value="start"></label><label>终点 <input id="to" value="door"></label></div><div id="outdoorFields"><label>起点经度 <input id="lng" type="number" step="any" value="116.397"></label><label>起点纬度 <input id="lat" type="number" step="any" value="39.908"></label><label>缓存目的地 <input id="destination" value="演示服务台"></label></div><button>规划路线</button></form><svg id="map" viewBox="0 0 500 240" role="img" aria-label="室内示意图"><text x="20" y="40">选择室内模式读取示意图</text></svg><p>位置：<strong id="position">估算位置，尚未初始化</strong></p><pre id="route">尚未规划路线</pre><div class="actions"><button data-action="next">下一步播报</button><button data-action="repeat">重复播报</button><button data-action="execute">执行室内路线</button><button data-action="pause">暂停</button><button data-action="resume">明确继续</button></div></section>
<section><h2>状态与调试</h2><pre id="state">读取中</pre><label>文字口令 <input id="voiceText" value="你好"></label><button id="voice">发送文字口令</button><h3>模拟障碍物</h3><div class="actions"><button data-obstacle="clear">清除</button><button data-obstacle="caution">注意</button><button data-obstacle="stop">阻挡</button></div><p id="result" role="status" aria-live="polite"></p><h3>实时事件 <span id="wsState">连接中</span></h3><pre id="events" aria-label="事件日志"></pre></section></div></main><script src="/static/app.js"></script></body></html>
